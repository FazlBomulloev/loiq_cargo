services:
  postgres:
    image: postgres:16-alpine
    container_name: loik-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loik}
      POSTGRES_USER: ${POSTGRES_USER:-loik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loik_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U ${POSTGRES_USER:-loik} -d ${POSTGRES_DB:-loik}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: loik-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    container_name: loik-migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: loik-backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build:
      context: ./backend
    container_name: loik-bot
    env_file: .env
    command: ["python", "-m", "bot"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["bot"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: loik-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
